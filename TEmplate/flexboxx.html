<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <link rel="stylesheet" href="">

   <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: darkolivegreen;
    }
    body{
        min-height: 100dvh;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 16px;
        background-color: white;
        color: white;
    }
    section{
        padding: 10px;
    }
    .box{
        background-color: darksalmon;
    }
    .fc{
        display: flex;
        gap: 10px;
        flex-direction: row;
        justify-content: flex-start;
        justify-content: flex-end;
        justify-content: center;
        align-items: flex-start;
        align-items: flex-end;
        align-items: center;
        
    }
    
   </style>
</head>
<body> 
    <section class="box" style="height: 15vh;text-align: center;font-size: large;align-items: center;padding-top: 40px;">Header/navBar</section>


<section style="display: flex;justify-content: center;justify-content: space-around; flex-direction: row;gap: 20px;">

    <section class="box" style="display: flex;justify-content: center;align-items: center;height: 40vh;width: 40vh;  background-color: cadetblue;margin:  100px 0 ;padding: 5%;border-radius: 25px;">Box 1</section>

    <section class="box" style="display: flex;justify-content: center;align-items: center;height: 40vh;width: 40vh;  background-color: cadetblue;margin:100px 0 ;padding: 5%;border-radius: 25px;">Box 2</section>

    <section class="box" style="display: flex;justify-content: center;align-items: center;height: 40vh;width: 40vh;  background-color: cadetblue;margin:100px 0;padding:5%;border-radius: 25px;">Box 3</section>
</section>
    <section class="box" style="position: absolute;bottom: 0;left: 0;height: 15vh;width:100%;text-align: center;font-size: large;padding-top:40px;">Footer</section>
    
</body>
</html>
