<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content="Create a login form">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login from</title>
</head>
 <style>
    body{
      min-height: 100dvh;
      background-color: rgb(42, 42, 111);
      font-family: 'Times New Roman', Times, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url(https://www.chitkara.edu.in/blogs/wp-content/uploads/2022/03/CUB4-Top-10-reasons-why-Chitkara-University-is-the-best-University-in-North-India.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      
    }

 </style>
<body>
    <div style="background-color: rgb(228, 238, 247);
    height: 250px;
    width:400px;
    display: flex;
    /* justify-content: center; */
    /* align-items: center; */
    margin: 20px;
    padding: 2px 10px;
    border-radius: 20px;
    box-sizing: content-box;">
        <form style="width: 100%;">
            <h1 style="text-align: center;">Log in</h1>
            <label style="font-style: oblique;">Email:</label><br>
            <input style="border-radius: 9px;min-height: 25px;width :300px;" type="text" placeholder="Enter your email"><br><br>

            <label style="font-style:oblique;">Password:</label><br>
            <input style="border-radius: 9px;min-height: 25px;width: 300px;" type="text" placeholder="Enter your password"><br><br>


            <input style="background-color: rgb(25, 122, 154);width:400px;border-radius: 25px;height:26px;" type="submit" placeholder="Submit">

            
        </form>
    
        
    </div>

   
</body>
