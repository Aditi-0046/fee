<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style1.css"/>
</head>
<body>
    <header class="fcx">&#9812;</header>
    <main>
        <h3>List 1</h3>
        <ul id="u1">
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
        </ul>
        <br />
        <h3>List 2</h3>
        <ul id="u2">
            <li>Four</li>
            <li>Five</li>
            <li>Six</li>
        </ul>
    </main>

    <script>
        var ul = document.querySelectorAll("ul");
        
        ul[0].style.cssText = "background-color:indianred";
        ul[1].style.cssText = "background-color: lightblue";
        
        let ul0 = ul[0].firstElementChild;
        ul0.style.fontSize = "1.5rem";
        ul0.nextElementSibling.style.color = "yellow";

        let ul1 = ul[1].lastElementChild;
        ul1.style.color = "green";
    </script>

    
</body>
</html>
