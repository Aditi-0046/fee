<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The  three Over lapping circle</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    height:100vh;
    background:#2f6fa8;      /* Blue background */
    font-family:Arial, sans-serif;
}

.container{
    width:100%;
    height:170px;
    background:white;
    position:relative;
}

.circle{
    width:90px;
    height:90px;
    border:2px solid #8fa6d8;
    border-radius:50%;
    position:absolute;
    top:25px;
}

.c1{
    left:50%;
}

.c2{
    left:47%;
}

.c3{
    left:52%;
}
    </style>
</head>
<body>
    <div class = "container">
        <div class = "circle c1"></div>
        <div class = "circle c2 "></div>
        <div class = "circle c3"></div>
    </div>
</body>
</html>
