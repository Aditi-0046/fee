<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
  body{
    margin: 0;
    height: 100vh;
    background-image: url("https://png.pngtree.com/background/20211217/original/pngtree-black-line-art-leaves-beautiful-abstract-background-picture-image_1599233.jpg");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    
  }
  </style>

<body>
 

    <div
    style="
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;">
    

        <div
        style="
        width:50%;
        border: 6px outset black;
        background-color:rgb(255, 240, 245);
        margin:20px;
        padding:45px;
        border-radius:50px;
        /* text-shadow: 3px 3px 8px black; */
        box-shadow:0px 0px 5px gray;">

            <H1 style="text-shadow: 2px 2px 2px white;">REGISTRATION FORM</H1>
            <form style="font-size: larger;">
                <label style="font-style: italic;">Full name:</label><br>
                <input type="text" placeholder="Enter your name"><br><br>

                <label style="font-style: italic;">Email:</label><br>
                <input type="text" placeholder="Enter your email"><br><br>

                <label style="font-style: italic;">Phone number:</label><br>
                <input type="tel" placeholder="Enter your phone number"><br><br>

                <label style="font-style: italic;">City:</label><br>
                <input type="Text" placeholder="Enter your city"><br><br>

                <label style="font-style: italic;">State:</label><br>
                <input type="Text" placeholder="Enter your state"><br><Br>

                <label style="font-style: italic;">Gender:</label><br>
                <input style="cursor: pointer;"  type="radio" name="gender">Male<br>
                <input style="cursor: pointer;"  type="radio" name="Gender">Female<br>
                <input style="cursor: pointer;"  type="radio" name="Gender">Other<br>
                <br><br>

                <!-- <label style="font-style: italic;">Submit</label><br> -->
                <input style="border: 2px solid; border-radius: 10px;height:30px;width:70px;justify-content: center;cursor: pointer;"   type="submit" placeholder="Submit">
            </form>

        </div>

    </div>

</body>
</html>
