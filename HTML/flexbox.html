<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <link rel="stylesheet" href="">

   <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        min-height: 100dvh;
        font-family: 'Times New Roman', Times, serif;
        font-size: 16px;
        background-color: white;
        color: white;
    }
    section{
        padding: 10px;
    }
    .box{
        background-color: darkred;
    }
    
   </style>
</head>
<body>
    <section class="box" style="height: 10vh;text-align: center;font-size: large;">Header/navBar</section>
    <section class="box" style="position: absolute;bottom: 0;left: 0;height: 10vh;width:100%;text-align: center;font-size: large;">Footer</section>
    
</body>
</html>
